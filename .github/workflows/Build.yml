name: Build
run-name: ${{ github.ref_name }} build run

on:
  push:
    tags:
      - '*'
  repository_dispatch:
    types: [run_build]

permissions:
  contents: write

jobs:

  build-linux:
    name: Linux
    uses: ./.github/workflows/Linux.yml

  build-macos:
    name: macOS
    uses: ./.github/workflows/MacOS.yml

  build-windows-x64:
    name: Windows x64
    uses: ./.github/workflows/Windows-x64-MXE.yml

  #build-windows-arm64:
  #  name: Windows ARM64 (MSVC)
  #  uses: ./.github/workflows/Windows-ARM64.yml

  create-release:
    name: Create Release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-macos
      - build-windows-x64
      #- build-windows-arm64
    defaults:
      run:
        shell: bash

    steps:
      - name: Check Release Tag
        id: check
        run: |
          : Check Release Tag
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          TAG="${GITHUB_REF_NAME}"

          # Only accept tags in the form v<number> (e.g. v1, v2, v42)
          if [[ "$TAG" =~ ^v([0-9]+)$ ]]; then
            echo 'validTag=true' >> $GITHUB_OUTPUT
            echo 'prerelease=false' >> $GITHUB_OUTPUT
            echo "build_number=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
          else
            echo "::error::Tag '${TAG}' does not match required format v<number> (e.g. v1, v2, v42). Stopping."
            echo 'validTag=false' >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        if: fromJSON(steps.check.outputs.validTag)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve upstream RetroArch version from git history
        id: upstream
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Resolve upstream RetroArch version from git history
          # Add upstream remote and fetch all release tags
          git remote add upstream https://github.com/libretro/RetroArch.git
          git fetch upstream 'refs/tags/v*:refs/tags/upstream-v*' --no-tags 2>/dev/null || true

          # Find the most recent upstream tag that is an ancestor of HEAD.
          # This tells us exactly which RA release main was rebased onto.
          RA_TAG=$(git tag --list 'upstream-v*' --sort=-version:refname \
                   | while read -r t; do
                       if git merge-base --is-ancestor "$t" HEAD 2>/dev/null; then
                         echo "$t"
                         break
                       fi
                     done)

          # Strip the 'upstream-' prefix we added during fetch, then strip 'v'
          RA_TAG="${RA_TAG#upstream-}"
          RA_VERSION="${RA_TAG#v}"

          if [[ -z "$RA_VERSION" ]]; then
            echo "::warning::Could not determine upstream RA version from git history. Falling back to API."
            RA_VERSION=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ github.token }}" \
              https://api.github.com/repos/libretro/RetroArch/releases/latest \
              | jq -r '.tag_name // empty' | sed 's/^v//')
          fi

          echo "ra_version=${RA_VERSION}" >> $GITHUB_OUTPUT
          echo "Detected upstream RA version: ${RA_VERSION}"

      - name: Build combined version string
        id: ver
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Build combined version string
          RA="${{ steps.upstream.outputs.ra_version }}"
          BUILD="${{ steps.check.outputs.build_number }}"
          echo "version=${RA}.${BUILD}" >> $GITHUB_OUTPUT

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        if: fromJSON(steps.check.outputs.validTag)
        id: download

      - name: Rename artifacts to versioned names
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Rename artifacts to versioned names
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          # macOS zip → retroarch-macos.zip
          for f in **/RetroArch-macos-*.zip **/retroarch-macos-*.zip; do
            [[ -f "$f" ]] || continue
            mv "$f" "$(dirname "$f")/retroarch-macos.zip"
          done

          # Linux tarball → retroarch-linux-x86_64.tar.gz
          for f in **/retroarch-linux-x86_64-*.tar.gz; do
            [[ -f "$f" ]] || continue
            mv "$f" "$(dirname "$f")/retroarch-linux-x86_64.tar.gz"
          done

          # Windows zip → retroarch-windows-x64.zip
          for f in **/retroarch-windows-x64-*.zip; do
            [[ -f "$f" ]] || continue
            mv "$f" "$(dirname "$f")/retroarch-windows-x64.zip"
          done

          # Windows installer → retroarch-windows-x64-installer.exe
          for f in **/retroarch-windows-x64-*-installer.exe; do
            [[ -f "$f" ]] || continue
            mv "$f" "$(dirname "$f")/retroarch-windows-x64-installer.exe"
          done

      - name: Generate Checksums
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Generate Checksums
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          echo "### Checksums" > ${{ github.workspace }}/CHECKSUMS.txt
          for file in \
              retroarch-macos/retroarch-macos.zip \
              retroarch-linux-x86_64/retroarch-linux-x86_64.tar.gz \
              retroarch-windows-x64/retroarch-windows-x64.zip \
              retroarch-windows-x64-installer/retroarch-windows-x64-installer.exe; do
            [[ -f "$file" ]] || continue
            echo "    ${file##*/}: $(sha256sum "$file" | cut -d ' ' -f 1)" >> ${{ github.workspace }}/CHECKSUMS.txt
          done

      - name: Create GitHub Release
        if: fromJSON(steps.check.outputs.validTag)
        uses: softprops/action-gh-release@9d7c94cfd0a1f3ed45544c887983e9fa900f0564
        with:
          draft: false
          prerelease: ${{ fromJSON(steps.check.outputs.prerelease) }}
          tag_name: ${{ github.ref_name }}
          name: RetroArch ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          body_path: ${{ github.workspace }}/CHECKSUMS.txt
          files: |
            retroarch-macos/retroarch-macos.zip
            retroarch-linux-x86_64/retroarch-linux-x86_64.tar.gz
            retroarch-windows-x64/retroarch-windows-x64.zip
            retroarch-windows-x64-installer/retroarch-windows-x64-installer.exe
