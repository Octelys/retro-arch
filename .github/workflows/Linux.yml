      - name: Get short SHA
        id: slug
        run: echo "sha8=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: retroarch-linux-x86_64-${{ steps.slug.outputs.sha8 }}
          path: retroarch-linux-x86_64-${{ steps.slug.outputs.sha8 }}.tar.gz
