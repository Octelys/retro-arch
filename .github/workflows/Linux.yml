name: CI Linux (i686)

on:
  push:
    branches:
      - main
  pull_request:
  repository_dispatch:
    types: [run_build]
  workflow_call:

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: git.libretro.com:5050/libretro-infrastructure/libretro-build-i386-ubuntu:xenial-gcc9
      options: --user root

    steps:
      - name: Check Out Repo
        uses: taiki-e/checkout-action@v1

      - name: Install libwebsockets
        run: apt-get update && apt-get install -y libwebsockets-dev

      - name: Configure Build
        run: |
          ./configure --disable-qt --enable-xdelta

      - name: Compile RA
        run: |
          make -j$(getconf _NPROCESSORS_ONLN) clean
          make -j$(getconf _NPROCESSORS_ONLN) info all

      - name: Stage binary
        run: cp retroarch /github/workspace/retroarch

      - name: Cache binary for upload job
        uses: actions/cache/save@v4
        with:
          path: /github/workspace/retroarch
          key: linux-i686-binary-${{ github.run_id }}

  upload:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Restore binary from cache
        uses: actions/cache/restore@v4
        with:
          path: retroarch
          key: linux-i686-binary-${{ github.run_id }}

      - name: Get short SHA
        id: slug
        run: echo "sha8=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v7
        with:
          name: retroarch-linux-i686-${{ steps.slug.outputs.sha8 }}
          path: retroarch
