name: CI Linux (x86_64)

on:
  pull_request:
  repository_dispatch:
    types: [run_build]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libasound2-dev libpulse-dev libsdl2-dev \
            libfreetype6-dev libx11-dev libxext-dev \
            libx11-xcb-dev \
            libxinerama-dev libxrandr-dev libxi-dev \
            libxss-dev libxxf86vm-dev libxkbcommon-dev \
            libudev-dev libgbm-dev libdrm-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            libvulkan-dev libwayland-dev wayland-protocols \
            liblzma-dev libmbedtls-dev libflac-dev \
            libass-dev libjack-jackd2-dev libv4l-dev \
            libwebsockets-dev libfontconfig1-dev \
            libdbus-1-dev zlib1g-dev \
            libespeak-ng-dev

      - name: Configure Build
        run: ./configure --disable-qt

      - name: Compile RA
        run: |
          # Embed $ORIGIN rpath so the binary finds bundled .so files next to itself.
          # Makefile.local is -include'd by the main Makefile; writing the flag here
          # avoids bash/make quoting issues that break $ORIGIN on the command line.
          echo 'LDFLAGS += -Wl,-rpath,\$$ORIGIN' > Makefile.local
          make -j$(getconf _NPROCESSORS_ONLN) \
            HAVE_DBUS=1 \
            HAVE_TRANSLATE=1 \
            HAVE_ACCESSIBILITY=1 \
            HAVE_WEBSOCKET_SERVER=1

      - name: Download companion assets
        run: |
          git clone --depth=1 https://github.com/libretro/retroarch-assets.git        assets-repo
          git clone --depth=1 https://github.com/libretro/libretro-core-info.git      core-info-repo
          git clone --depth=1 https://github.com/libretro/retroarch-joypad-autoconfig.git joypad-repo
          git clone --depth=1 https://github.com/libretro/libretro-database.git       database-repo
          git clone --depth=1 https://github.com/libretro/common-overlays.git         overlays-repo
          git clone --depth=1 https://github.com/libretro/glsl-shaders.git            glsl-repo

      - name: Bundle release
        run: |
          SHA=$(echo ${GITHUB_SHA} | cut -c1-8)
          BUNDLE=retroarch-linux-x86_64-${SHA}
          mkdir -p ${BUNDLE}/assets ${BUNDLE}/info ${BUNDLE}/autoconfig \
                   ${BUNDLE}/database/rdb ${BUNDLE}/database/cursors \
                   ${BUNDLE}/overlays ${BUNDLE}/shaders/shaders_glsl \
                   ${BUNDLE}/saves ${BUNDLE}/screenshots ${BUNDLE}/states \
                   ${BUNDLE}/system

          cp retroarch ${BUNDLE}/

          # Copy portable launcher script that ensures RetroArch finds
          # its bundled assets (fonts, icons, etc.) and shared libraries.
          cp pkg/linux/retroarch.sh ${BUNDLE}/retroarch.sh
          chmod +x ${BUNDLE}/retroarch.sh

          # Place osd-font.ttf in the bundle root so the font renderers'
          # relative-path fallback ("osd-font.ttf") finds it when CWD is
          # the bundle directory (set by retroarch.sh above).
          ln -sf assets/pkg/osd-font.ttf ${BUNDLE}/osd-font.ttf

          cp retroarch.cfg ${BUNDLE}/retroarch.default.cfg 2>/dev/null || true

          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='.gitignore' \
            --exclude='.gitlab-ci.yml' \
            --exclude='src/' --exclude='scripts/' --exclude='branding/' \
            --exclude='ctr/' --exclude='nxrgui/' --exclude='switch/' \
            --exclude='wallpapers/' \
            --exclude='Makefile' --exclude='configure' \
            --exclude='README.md' --exclude='COPYING' \
            assets-repo/.           ${BUNDLE}/assets/
          rsync -a \
            --exclude='.git' --exclude='Makefile' --exclude='configure' --exclude='COPYING' \
            core-info-repo/.        ${BUNDLE}/info/
          rsync -a --exclude='.git' joypad-repo/linuxraw/. ${BUNDLE}/autoconfig/linuxraw/
          rsync -a --exclude='.git' joypad-repo/udev/.     ${BUNDLE}/autoconfig/udev/
          rsync -a --exclude='.git' joypad-repo/sdl2/.     ${BUNDLE}/autoconfig/sdl2/
          rsync -a --exclude='.git' joypad-repo/hid/.      ${BUNDLE}/autoconfig/hid/
          rsync -a --exclude='.git' database-repo/rdb/.    ${BUNDLE}/database/rdb/
          rsync -a --exclude='.git' database-repo/cursors/. ${BUNDLE}/database/cursors/
          rsync -a \
            --exclude='.git' --exclude='Makefile' --exclude='configure' --exclude='ctr/' \
            overlays-repo/.         ${BUNDLE}/overlays/
          rsync -a \
            --exclude='.git' --exclude='Makefile' --exclude='configure' \
            glsl-repo/.             ${BUNDLE}/shaders/shaders_glsl/

          # Verify $ORIGIN rpath was baked in
          if readelf -d retroarch | grep -q 'ORIGIN'; then
            echo "✓ RPATH with \$ORIGIN found in binary"
          else
            echo "✗ ERROR: \$ORIGIN rpath missing from binary"
            readelf -d retroarch | grep -i -E 'rpath|runpath' || true
            exit 1
          fi

          # Bundle libwebsockets shared library
          LWS_SO=$(ldd retroarch | awk '/libwebsockets/{print $3}')
          if [ -n "$LWS_SO" ]; then
            cp -L "$LWS_SO" ${BUNDLE}/
            echo "✓ Bundled: $LWS_SO"
          else
            echo "✗ ERROR: libwebsockets not found in ldd output"
            ldd retroarch
            exit 1
          fi

          # Bundle libfreetype and libfontconfig so OSD/menu fonts render
          # correctly on systems where they are not installed.
          for lib in libfreetype libfontconfig; do
            SO=$(ldd retroarch | awk "/${lib}/"'{print $3}' | head -1)
            if [ -n "$SO" ]; then
              cp -L "$SO" ${BUNDLE}/
              echo "✓ Bundled: $SO"
            fi
          done

          tar -czf ${BUNDLE}.tar.gz ${BUNDLE}/

      - name: Get short SHA
        id: slug
        run: echo "sha8=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: retroarch-linux-x86_64
          path: retroarch-linux-x86_64-${{ steps.slug.outputs.sha8 }}.tar.gz
