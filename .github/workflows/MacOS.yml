name: CI macOS

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v6

    - name: Install libwebsockets
      run: |
        brew install libwebsockets
        mkdir -p deps/libwebsockets/include
        cp -r "$(brew --prefix libwebsockets)/include/" deps/libwebsockets/include/
        # Stage OpenSSL headers required transitively by libwebsockets.h
        OPENSSL_PREFIX=$(brew --prefix openssl 2>/dev/null || brew --prefix openssl@3)
        cp -r "${OPENSSL_PREFIX}/include/openssl" deps/libwebsockets/include/openssl

    - name: Compile RA
      run: |
        set -o pipefail
        xcodebuild -workspace pkg/apple/RetroArch.xcworkspace -scheme RetroArch -config Release -xcconfig pkg/apple/GitHubCI.xcconfig -derivedDataPath build

    - name: Get short SHA
      id: slug
      run: echo "sha8=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_OUTPUT

    - name: Download companion assets
      run: |
        git clone --depth=1 https://github.com/libretro/retroarch-assets.git        assets-repo
        git clone --depth=1 https://github.com/libretro/libretro-core-info.git      core-info-repo
        git clone --depth=1 https://github.com/libretro/retroarch-joypad-autoconfig.git joypad-repo
        git clone --depth=1 https://github.com/libretro/libretro-database.git       database-repo
        git clone --depth=1 https://github.com/libretro/common-overlays.git         overlays-repo
        git clone --depth=1 https://github.com/libretro/glsl-shaders.git            glsl-repo

    - name: Bundle release
      run: |
        SHA=${{ steps.slug.outputs.sha8 }}
        BUNDLE=retroarch-macos-${SHA}
        APP=build/Build/Products/Release/RetroArch.app
        RESOURCES=${APP}/Contents/Resources
        mkdir -p ${BUNDLE} \
                 ${RESOURCES}/assets ${RESOURCES}/info ${RESOURCES}/autoconfig \
                 ${RESOURCES}/database/rdb ${RESOURCES}/database/cursors \
                 ${RESOURCES}/overlays ${RESOURCES}/shaders/shaders_glsl \
                 ${RESOURCES}/saves ${RESOURCES}/screenshots ${RESOURCES}/states \
                 ${RESOURCES}/system

        rsync -a \
          --exclude='.git' --exclude='.github' --exclude='.gitignore' \
          --exclude='.gitlab-ci.yml' \
          --exclude='src/' --exclude='scripts/' --exclude='branding/' \
          --exclude='ctr/' --exclude='nxrgui/' --exclude='switch/' \
          --exclude='wallpapers/' \
          --exclude='Makefile' --exclude='configure' \
          --exclude='README.md' --exclude='COPYING' \
          assets-repo/.           ${RESOURCES}/assets/
        rsync -a \
          --exclude='.git' --exclude='Makefile' --exclude='configure' --exclude='COPYING' \
          core-info-repo/.        ${RESOURCES}/info/
        rsync -a --exclude='.git' joypad-repo/sdl2/.     ${RESOURCES}/autoconfig/sdl2/
        rsync -a --exclude='.git' joypad-repo/hid/.      ${RESOURCES}/autoconfig/hid/
        rsync -a --exclude='.git' joypad-repo/mfi/.      ${RESOURCES}/autoconfig/mfi/
        rsync -a --exclude='.git' database-repo/rdb/.    ${RESOURCES}/database/rdb/
        rsync -a --exclude='.git' database-repo/cursors/. ${RESOURCES}/database/cursors/
        rsync -a \
          --exclude='.git' --exclude='Makefile' --exclude='configure' --exclude='ctr/' \
          overlays-repo/.         ${RESOURCES}/overlays/
        rsync -a \
          --exclude='.git' --exclude='Makefile' --exclude='configure' \
          glsl-repo/.             ${RESOURCES}/shaders/shaders_glsl/

        cp -r ${APP} ${BUNDLE}/
        zip -r ${BUNDLE}.zip ${BUNDLE}/

    - uses: actions/upload-artifact@v4
      with:
        name: retroarch-macos
        path: retroarch-macos-${{ steps.slug.outputs.sha8 }}.zip
