name: CI Windows ARM64 (MSVC)

on:
  pull_request:
  repository_dispatch:
    types: [run_build]
  workflow_call:

permissions:
  contents: read

jobs:
  msvc:
    runs-on: windows-11-arm
    timeout-minutes: 60
    strategy:
      matrix:
        version: [2022]
        configuration: [Release]
        platform: [ARM64]

    steps:
      - uses: actions/checkout@v4

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      # Cache vcpkg binary artefacts so OpenSSL/libwebsockets are not rebuilt every run
      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-arm64-windows-${{ hashFiles('**/vcpkg.json') }}-v1
          restore-keys: |
            vcpkg-arm64-windows-

      - name: Install libwebsockets (vcpkg)
        shell: powershell
        run: |
          $vcpkgRoot = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          & "$vcpkgRoot\vcpkg.exe" install libwebsockets:arm64-windows
          $installed = "$vcpkgRoot\installed\arm64-windows"
          New-Item -ItemType Directory -Force deps\libwebsockets\include | Out-Null
          New-Item -ItemType Directory -Force deps\libwebsockets\arm64 | Out-Null
          Copy-Item -Path "$installed\include\*" -Destination deps\libwebsockets\include -Recurse -Force
          $lib = Get-ChildItem "$installed\lib" -Filter "websocket*.lib" | Select-Object -First 1
          if ($lib) { Copy-Item $lib.FullName deps\libwebsockets\arm64\websockets.lib -Force }

      - name: Compile RA
        working-directory: "${{ github.workspace }}/pkg/msvc"
        run: |
          msbuild -p:"Configuration=${{ matrix.configuration }}" -p:"Platform=${{ matrix.platform }}" .\RetroArch-msvc${{ matrix.version }}.sln

      - name: Get short SHA
        id: slug
        shell: powershell
        run: echo "sha8=$('${{ github.sha }}'.Substring(0,8))"  >> $env:GITHUB_OUTPUT

      - name: Download companion assets
        shell: bash
        run: |
          git -c core.autocrlf=false clone --depth=1 https://github.com/libretro/retroarch-assets.git            assets-repo
          git -c core.autocrlf=false clone --depth=1 https://github.com/libretro/libretro-core-info.git          core-info-repo
          git -c core.autocrlf=false clone --depth=1 https://github.com/libretro/retroarch-joypad-autoconfig.git joypad-repo
          git -c core.autocrlf=false clone --depth=1 https://github.com/libretro/libretro-database.git           database-repo
          git -c core.autocrlf=false clone --depth=1 https://github.com/libretro/common-overlays.git             overlays-repo
          git -c core.autocrlf=false clone --depth=1 https://github.com/libretro/glsl-shaders.git                glsl-repo

      - name: Bundle release
        shell: powershell
        run: |
          $sha    = '${{ steps.slug.outputs.sha8 }}'
          $bundle = "retroarch-windows-arm64-$sha"
          $exe    = "pkg\msvc\${{ matrix.platform }}\${{ matrix.configuration }}\RetroArch-msvc${{ matrix.version }}.exe"

          foreach ($dir in @(
            "$bundle\assets", "$bundle\info", "$bundle\autoconfig",
            "$bundle\database\rdb", "$bundle\database\cursors",
            "$bundle\overlays", "$bundle\shaders\shaders_glsl",
            "$bundle\saves", "$bundle\screenshots", "$bundle\states",
            "$bundle\system"
          )) { New-Item -ItemType Directory -Force $dir | Out-Null }

          Copy-Item $exe "$bundle\RetroArch.exe"
          if (Test-Path retroarch.cfg) { Copy-Item retroarch.cfg "$bundle\retroarch.default.cfg" }

          # robocopy exit codes 0-7 are success (files copied/skipped); 8+ are errors
          function Robocopy-Safe { robocopy @args | Out-Null; if ($LASTEXITCODE -gt 7) { exit $LASTEXITCODE } }

          Robocopy-Safe assets-repo      "$bundle\assets"                /E /XD .git .github src scripts branding ctr nxrgui switch fonts wallpapers /XF .gitignore .gitlab-ci.yml Makefile configure README.md COPYING
          Robocopy-Safe core-info-repo   "$bundle\info"                  /E /XD .git /XF Makefile configure COPYING
          Robocopy-Safe joypad-repo\dinput "$bundle\autoconfig\dinput"   /E /XD .git
          Robocopy-Safe joypad-repo\sdl2   "$bundle\autoconfig\sdl2"     /E /XD .git
          Robocopy-Safe joypad-repo\xinput "$bundle\autoconfig\xinput"   /E /XD .git
          Robocopy-Safe joypad-repo\hid    "$bundle\autoconfig\hid"      /E /XD .git
          Robocopy-Safe database-repo\rdb     "$bundle\database\rdb"     /E /XD .git
          Robocopy-Safe database-repo\cursors "$bundle\database\cursors" /E /XD .git
          Robocopy-Safe overlays-repo    "$bundle\overlays"              /E /XD .git ctr /XF Makefile configure
          Robocopy-Safe glsl-repo        "$bundle\shaders\shaders_glsl"  /E /XD .git /XF Makefile configure

          # 7z is preinstalled on GitHub runners and is much faster than Compress-Archive
          7z a -tzip -mx=1 "$bundle.zip" $bundle\

      - name: Build installer
        shell: powershell
        run: |
          $sha    = '${{ steps.slug.outputs.sha8 }}'
          $bundle = "retroarch-windows-arm64-$sha"

          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis --no-progress --yes
            $env:PATH += ";C:\Program Files (x86)\NSIS"
          }

          makensis `
            /DVERSION=$sha `
            /DARCH=arm64 `
            /DBUNDLE_DIR="$(Resolve-Path $bundle)" `
            pkg\windows\installer.nsi

          Move-Item "pkg\windows\$bundle-installer.exe" "$bundle-installer.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: retroarch-windows-arm64-${{ steps.slug.outputs.sha8 }}
          path: retroarch-windows-arm64-${{ steps.slug.outputs.sha8 }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: retroarch-windows-arm64-${{ steps.slug.outputs.sha8 }}-installer
          path: retroarch-windows-arm64-${{ steps.slug.outputs.sha8 }}-installer.exe
