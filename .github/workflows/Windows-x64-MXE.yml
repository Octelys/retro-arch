name: CI Windows x64 (MXE)

on:
  push:
    branches:
      - main
  #pull_request:
  repository_dispatch:
    types: [run_build]
  workflow_call:

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: git.libretro.com:5050/libretro-infrastructure/libretro-build-mxe-win64-cross:gcc10
      options: --user root

    steps:
    - uses: taiki-e/checkout-action@v1

    - name: Install MXE libwebsockets (optional)
      run: |
        if apt-get install -y mxe-x86-64-w64-mingw32.shared-libwebsockets; then
          echo "MXE libwebsockets installed; staging into deps/libwebsockets/x64/"
          mkdir -p deps/libwebsockets/include deps/libwebsockets/x64
          cp /usr/lib/mxe/usr/x86_64-w64-mingw32.shared/include/libwebsockets.h deps/libwebsockets/include/ || true
          cp /usr/lib/mxe/usr/x86_64-w64-mingw32.shared/lib/libwebsockets.dll.a deps/libwebsockets/x64/ 2>/dev/null || \
            cp /usr/lib/mxe/usr/x86_64-w64-mingw32.shared/lib/libwebsockets.a deps/libwebsockets/x64/ 2>/dev/null || true
        else
          echo "MXE libwebsockets not available; building without WebSocket server support"
        fi

    - name: Compile RA
      run: |
        export MOC=/usr/lib/mxe/usr/x86_64-w64-mingw32.shared/qt5/bin/moc
        ./configure --host=x86_64-w64-mingw32.shared
        make clean
        if [ -f deps/libwebsockets/x64/libwebsockets.dll.a ] || [ -f deps/libwebsockets/x64/libwebsockets.a ]; then
          make -j$(getconf _NPROCESSORS_ONLN) HAVE_WEBSOCKET_SERVER=1
        else
          make -j$(getconf _NPROCESSORS_ONLN)
        fi

    - name: Get short SHA
      id: slug
      run: echo "sha8=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_OUTPUT

    - name: Download companion assets
      run: |
        git clone --depth=1 https://github.com/libretro/retroarch-assets.git         assets-repo
        git clone --depth=1 https://github.com/libretro/libretro-database.git        database-repo
        git clone --depth=1 https://github.com/libretro/libretro-core-info.git       core-info-repo
        git clone --depth=1 https://github.com/libretro/retroarch-joypad-autoconfig.git joypad-repo
        git clone --depth=1 https://github.com/libretro/slang-shaders.git            slang-repo
        git clone --depth=1 https://github.com/libretro/glsl-shaders.git             glsl-repo
        git clone --depth=1 https://github.com/libretro/common-overlays.git          overlays-repo

    - name: Bundle release
      run: |
        SHA=${{ steps.slug.outputs.sha8 }}
        BUNDLE=retroarch-windows-x64-${SHA}

        mkdir -p ${BUNDLE}
        cp retroarch.exe ${BUNDLE}/RetroArch.exe

        mkdir -p ${BUNDLE}/assets    && cp -r assets-repo/.    ${BUNDLE}/assets/
        mkdir -p ${BUNDLE}/database  && cp -r database-repo/.  ${BUNDLE}/database/
        mkdir -p ${BUNDLE}/info      && cp -r core-info-repo/. ${BUNDLE}/info/
        mkdir -p ${BUNDLE}/autoconfig && cp -r joypad-repo/.   ${BUNDLE}/autoconfig/
        mkdir -p ${BUNDLE}/shaders/slang && cp -r slang-repo/. ${BUNDLE}/shaders/slang/
        mkdir -p ${BUNDLE}/shaders/glsl  && cp -r glsl-repo/.  ${BUNDLE}/shaders/glsl/
        mkdir -p ${BUNDLE}/overlays  && cp -r overlays-repo/.  ${BUNDLE}/overlays/

        zip -r ${BUNDLE}.zip ${BUNDLE}/

    - name: Build installer
      run: |
        SHA=${{ steps.slug.outputs.sha8 }}
        BUNDLE=retroarch-windows-x64-${SHA}

        apt-get install -y nsis

        makensis \
          -DVERSION=${SHA} \
          -DARCH=x64 \
          -DBUNDLE_DIR=$(realpath ${BUNDLE}) \
          pkg/windows/installer.nsi

        mv pkg/windows/${BUNDLE}-installer.exe ${BUNDLE}-installer.exe

    - uses: actions/upload-artifact@v4
      with:
        name: retroarch-windows-x64-${{ steps.slug.outputs.sha8 }}
        path: retroarch-windows-x64-${{ steps.slug.outputs.sha8 }}.zip

    - uses: actions/upload-artifact@v4
      with:
        name: retroarch-windows-x64-${{ steps.slug.outputs.sha8 }}-installer
        path: retroarch-windows-x64-${{ steps.slug.outputs.sha8 }}-installer.exe
