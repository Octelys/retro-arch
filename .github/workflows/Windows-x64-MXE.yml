name: CI Windows x64 (MinGW)

on:
  pull_request:
  repository_dispatch:
    types: [run_build]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - uses: actions/checkout@v4

    - name: Set up MSYS2 / MinGW-w64 x86_64
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          base-devel
          git
          zip
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-pkg-config
          mingw-w64-x86_64-SDL2
          mingw-w64-x86_64-freetype
          mingw-w64-x86_64-zlib
          mingw-w64-x86_64-flac
          mingw-w64-x86_64-mbedtls
          mingw-w64-x86_64-libwebsockets

    - name: Configure
      run: ./configure --disable-qt

    - name: Compile RA
      run: make -j$(getconf _NPROCESSORS_ONLN) HAVE_WEBSOCKET_SERVER=1

    - name: Get short SHA
      id: slug
      run: echo "sha8=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_OUTPUT

#    - name: Download companion assets
