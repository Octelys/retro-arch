name: CI Windows x64 (MinGW)

on:
  pull_request:
  repository_dispatch:
    types: [run_build]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - uses: actions/checkout@v4

    - name: Set up MSYS2 / MinGW-w64 x86_64
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          base-devel
          git
          zip
          rsync
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-pkg-config
          mingw-w64-x86_64-SDL2
          mingw-w64-x86_64-freetype
          mingw-w64-x86_64-zlib
          mingw-w64-x86_64-flac
          mingw-w64-x86_64-mbedtls
          mingw-w64-x86_64-libwebsockets

    - name: Configure
      run: ./configure --disable-qt

    - name: Compile RA
      run: make -j$(getconf _NPROCESSORS_ONLN) HAVE_WEBSOCKET_SERVER=1

    - name: Download companion assets
      run: |
        git clone --depth=1 https://github.com/libretro/retroarch-assets.git           assets-repo
        git clone --depth=1 https://github.com/libretro/libretro-core-info.git         core-info-repo
        git clone --depth=1 https://github.com/libretro/retroarch-joypad-autoconfig.git joypad-repo
        git clone --depth=1 https://github.com/libretro/libretro-database.git          database-repo
        git clone --depth=1 https://github.com/libretro/common-overlays.git            overlays-repo
        git clone --depth=1 https://github.com/libretro/glsl-shaders.git               glsl-repo

    - name: Get short SHA
      id: slug
      run: echo "sha8=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_OUTPUT

    - name: Bundle release
      run: |
        SHA=${{ steps.slug.outputs.sha8 }}
        BUNDLE=retroarch-windows-x64-${SHA}
        mkdir -p ${BUNDLE}/assets ${BUNDLE}/info ${BUNDLE}/autoconfig \
                 ${BUNDLE}/database/rdb ${BUNDLE}/database/cursors \
                 ${BUNDLE}/overlays ${BUNDLE}/shaders/shaders_glsl \
                 ${BUNDLE}/saves ${BUNDLE}/screenshots ${BUNDLE}/states \
                 ${BUNDLE}/system

        cp retroarch.exe ${BUNDLE}/RetroArch.exe
        cp retroarch.cfg ${BUNDLE}/retroarch.default.cfg 2>/dev/null || true

        # assets: keep pkg/ (fallback fonts), drop src/ scripts/ branding/ fonts/ wallpapers/ platform dirs
        rsync -a \
          --exclude='.git' --exclude='.github' --exclude='.gitignore' \
          --exclude='.gitlab-ci.yml' \
          --exclude='src/' --exclude='scripts/' --exclude='branding/' \
          --exclude='ctr/' --exclude='nxrgui/' --exclude='switch/' \
          --exclude='fonts/' --exclude='wallpapers/' \
          --exclude='Makefile' --exclude='configure' \
          --exclude='README.md' --exclude='COPYING' \
          assets-repo/.           ${BUNDLE}/assets/
        # info: all .info files live at root of repo
        rsync -a \
          --exclude='.git' --exclude='Makefile' --exclude='configure' --exclude='COPYING' \
          core-info-repo/.        ${BUNDLE}/info/
        # autoconfig: Windows-relevant drivers only
        rsync -a --exclude='.git' \
          joypad-repo/dinput/.    ${BUNDLE}/autoconfig/dinput/
        rsync -a --exclude='.git' \
          joypad-repo/sdl2/.      ${BUNDLE}/autoconfig/sdl2/
        rsync -a --exclude='.git' \
          joypad-repo/xinput/.    ${BUNDLE}/autoconfig/xinput/
        rsync -a --exclude='.git' \
          joypad-repo/hid/.       ${BUNDLE}/autoconfig/hid/
        # database: rdb/ and cursors/ as subdirs
        rsync -a --exclude='.git' database-repo/rdb/.     ${BUNDLE}/database/rdb/
        rsync -a --exclude='.git' database-repo/cursors/. ${BUNDLE}/database/cursors/
        # overlays
        rsync -a \
          --exclude='.git' --exclude='Makefile' --exclude='configure' --exclude='ctr/' \
          overlays-repo/.         ${BUNDLE}/overlays/
        # shaders: glsl inside shaders/shaders_glsl/ to match official layout
        rsync -a \
          --exclude='.git' --exclude='Makefile' --exclude='configure' \
          glsl-repo/.             ${BUNDLE}/shaders/shaders_glsl/

        # Copy all MinGW runtime DLLs that RetroArch.exe depends on
        ldd retroarch.exe \
          | awk '/\/mingw64\/bin\//{print $3}' \
          | xargs -I{} cp {} ${BUNDLE}/

        zip -r ${BUNDLE}.zip ${BUNDLE}/

    - name: Build installer
      shell: powershell
      run: |
        $sha    = '${{ steps.slug.outputs.sha8 }}'
        $bundle = "retroarch-windows-x64-$sha"

        if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
          choco install nsis --no-progress --yes
          $env:PATH += ";C:\Program Files (x86)\NSIS"
        }

        makensis `
          /DVERSION=$sha `
          /DARCH=x64 `
          /DBUNDLE_DIR="$(Resolve-Path $bundle)" `
          pkg\windows\installer.nsi

        Move-Item "pkg\windows\$bundle-installer.exe" "$bundle-installer.exe"

    - uses: actions/upload-artifact@v4
      with:
        name: retroarch-windows-x64
        path: retroarch-windows-x64-${{ steps.slug.outputs.sha8 }}.zip

    - uses: actions/upload-artifact@v4
      with:
        name: retroarch-windows-x64-installer
        path: retroarch-windows-x64-${{ steps.slug.outputs.sha8 }}-installer.exe
