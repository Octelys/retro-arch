# Daily canary sync of upstream libretro/RetroArch master into this fork.
#
# Purpose: early breakage detection — NOT a source for merging into main.
#
# The sync branch (octelys/upstream-sync) contains:
#   upstream/master commits  +  your feature commits from main (rebased on top)
#
# CI runs against this branch so you find out the next morning if upstream
# broke any of your features. Fix issues on your feature/* branches, then
# merge them into main. Never merge the sync PR itself into main.

name: Upstream Sync

on:
  schedule:
    - cron: '0 6 * * *'  # every day at 06:00 UTC
  workflow_dispatch:      # allow manual trigger from the GitHub Actions UI

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/libretro/RetroArch.git
          git fetch upstream master --no-tags

      - name: Check for new upstream commits
        id: check
        run: |
          UPSTREAM_SHA=$(git rev-parse upstream/master)
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"

          # Count commits upstream has that the fork does not
          NEW=$(git rev-list --count main..upstream/master)
          echo "new_commits=$NEW" >> "$GITHUB_OUTPUT"
          echo "Upstream has $NEW new commit(s) compared to main"

      - name: Stop early if already up to date
        if: steps.check.outputs.new_commits == '0'
        run: |
          echo "Fork is already up to date with upstream. Nothing to do."

      - name: Create sync branch - upstream/master with your features rebased on top
        if: steps.check.outputs.new_commits != '0'
        run: |
          # Start the sync branch from upstream/master (not from main)
          git checkout -B octelys/upstream-sync upstream/master

          # Identify the commits on main that are not in the upstream baseline.
          # These are your feature commits. We cherry-pick them on top of
          # upstream/master so CI tests the combination.
          # Find the merge-base between main and the previous upstream state
          # so we only replay YOUR commits, not upstream ones.
          FORK_BASE=$(git merge-base main upstream/master || true)
          YOUR_COMMITS=$(git rev-list --reverse ${FORK_BASE}..main 2>/dev/null || true)

          if [[ -n "$YOUR_COMMITS" ]]; then
            git cherry-pick --allow-empty --keep-redundant-commits $YOUR_COMMITS || true
          fi

          # Always restore fork workflow files so upstream cannot overwrite them.
          git checkout main -- .github/workflows
          git diff --cached --quiet || \
            git commit -m "chore: preserve fork workflow files"

      - name: Push sync branch
        if: steps.check.outputs.new_commits != '0'
        run: |
          git push origin octelys/upstream-sync --force

      - name: Open or update pull request
        if: steps.check.outputs.new_commits != '0'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: octelys/upstream-sync
          base: main
          title: "chore: canary sync — upstream/master (${{ steps.check.outputs.new_commits }} new commit(s))"
          body: |
            ## Daily canary sync

            This PR was automatically generated by the **Upstream Sync** workflow.
            **Do not merge this PR into `main`.**

            Its purpose is early breakage detection: it contains upstream `master`
            commits with your feature commits from `main` rebased on top. If CI
            passes, your features are compatible with the current upstream `master`.
            If CI fails, fix the issue on your `feature/*` branches and merge into `main`.

            | | |
            |---|---|
            | **Upstream** | [`libretro/RetroArch@master`](https://github.com/libretro/RetroArch/tree/master) |
            | **Upstream SHA** | `${{ steps.check.outputs.upstream_sha }}` |
            | **New upstream commits** | ${{ steps.check.outputs.new_commits }} |
            | **Generated at** | ${{ github.run_id }} |

            ### This PR will NOT be merged
            - If CI is green: close the PR — your features are safe.
            - If CI is red: fix the broken `feature/*` branch, merge it into `main`, and the next daily run will reopen a fresh PR.

            > This PR is recreated or updated daily.
          labels: upstream-sync
          draft: false

